<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bermond Yange — Design & Product</title>
  <meta name="description" content="Bermond Yange: product designer, brand designer and AI product leader. Founder-CEO of Iknite Studio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/data.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="./">Bermond Yange</a>
    <nav class="tracks" aria-label="Portfolio focus" data-tracks></nav>
  </header>

  <main id="main">
    <section class="hero shell">
      <p class="eyebrow" data-eyebrow></p>
      <h1 data-headline></h1>
      <p class="lede" data-summary></p>
      <p class="meta" data-location></p>
      <div class="cta">
        <a class="btn" data-email>Email me</a>
        <span data-links></span>
      </div>
    </section>

    <section class="shell" aria-labelledby="work-h">
      <h2 id="work-h" class="section-h">Selected work</h2>
      <div class="grid" data-projects></div>
    </section>

    <section class="shell split" aria-labelledby="skills-h">
      <div>
        <h2 id="skills-h" class="section-h">What I bring</h2>
        <ul class="chips" data-skills></ul>
        <p class="meta" data-languages></p>
      </div>
      <div>
        <h2 class="section-h">Experience</h2>
        <ol class="timeline" data-experience></ol>
      </div>
    </section>
  </main>

  <footer class="shell foot">
    <p>© <span data-year></span> Bermond Yange · <a data-email-text></a></p>
  </footer>
</body>
</html>
